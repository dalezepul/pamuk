<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<!-- Pamuk master: semboller + boşta duruş. Kareler kare-uret.mjs ile bu parçalardan üretilir. Renk değişkenleri: --ten --vurgu --dolgu -->
<style>:root{--ten:#4FB3FF;--vurgu:#8A4DFF;--dolgu:#7fa6ff}.t{fill:var(--ten)}.ts{stroke:var(--ten)}.v{fill:var(--vurgu)}.ds{stroke:var(--dolgu)}.gs{stop-color:var(--ten)}.vs{stop-color:var(--vurgu)}</style><defs>
<radialGradient id="gv" cx=".36" cy=".28" r=".82"><stop offset="0" stop-color="#ffffff"/><stop offset=".48" stop-color="#f3eee8"/><stop offset=".84" stop-color="#cdc1b6"/><stop offset="1" stop-color="#b9ada2"/></radialGradient>
<radialGradient id="gk" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f3eee8"/><stop offset="1" stop-color="#cdc1b6"/></radialGradient>
<linearGradient id="ge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d2538"/><stop offset="1" stop-color="#14101a"/></linearGradient>
<radialGradient id="gb"><stop offset="0" stop-color="var(--ten)" stop-opacity=".95"/><stop offset=".55" stop-color="var(--ten)" stop-opacity=".55"/><stop offset="1" stop-color="var(--ten)" stop-opacity="0"/></radialGradient>
<radialGradient id="ga"><stop offset="0" stop-color="#ff9fb4" stop-opacity=".9"/><stop offset="1" stop-color="#ff9fb4" stop-opacity="0"/></radialGradient>
<filter id="h" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
<feMorphology in="SourceAlpha" operator="dilate" radius="1.3" result="d1"/><feFlood flood-color="#2b2530" flood-opacity=".78" result="c1"/><feComposite in="c1" in2="d1" operator="in" result="o1"/>
<feMorphology in="SourceAlpha" operator="dilate" radius="3.2" result="d2"/><feGaussianBlur in="d2" stdDeviation=".9" result="d2b"/><feFlood flood-color="#ffffff" flood-opacity=".55" result="c2"/><feComposite in="c2" in2="d2b" operator="in" result="o2"/>
<feMerge><feMergeNode in="o2"/><feMergeNode in="o1"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<symbol id="govde" overflow="visible"><circle r="36" fill="url(#gv)"/><ellipse cx="-17" cy="-25" rx="9.5" ry="5.5" transform="rotate(-38 -17 -25)" fill="#fff" opacity=".9"/><path d="M33.82 -12.34 A36 36 0 0 1 7.88 35.13" fill="none" class="ts" stroke-width="3" stroke-linecap="round" opacity=".55"/><path d="M-28.84 21.54 A36 36 0 0 1 -34.8 -9.2" fill="none" class="ds" stroke-width="2" stroke-linecap="round" opacity=".35"/></symbol>
<symbol id="kulak" overflow="visible"><circle r="11" fill="url(#gk)"/><circle r="6.2" class="t" opacity=".8"/><circle cx="-1.5" cy="-1.5" r="2.2" fill="#fff" opacity=".55"/></symbol>
<symbol id="kol" overflow="visible"><g fill="url(#gk)" stroke="#cdc1b6" stroke-width="1"><path d="M-4.25 0 a4.25 4.25 0 0 1 8.5 0 v11 a4.25 4.25 0 0 1 -8.5 0 z"/></g><circle cy="13.5" r="5" fill="url(#gk)" stroke="#cdc1b6" stroke-width="1"/></symbol>
<symbol id="gozKure" overflow="visible"><circle r="12" fill="#cdb9ab"/><circle r="11" fill="url(#ge)"/></symbol>
<symbol id="iris" overflow="visible"><circle r="6.3" fill="none" class="ts" stroke-width="2.4"/><circle r="5" class="t" opacity=".16"/></symbol>
<symbol id="parilti" overflow="visible"><ellipse cx="-3.6" cy="-3.9" rx="3.7" ry="2.6" transform="rotate(-25 -3.6 -3.9)" fill="#fff"/><circle cx="3.6" cy="3.2" r="1.5" fill="#fff" opacity=".9"/></symbol>
<symbol id="karin" overflow="visible"><ellipse rx="15" ry="8.5" fill="url(#gb)"/></symbol>
<symbol id="allik" overflow="visible"><ellipse rx="7" ry="4" fill="url(#ga)"/></symbol>
<g filter="url(#h)" transform="translate(64 80)">
<use href="#kulak" x="-27" y="-30"/><use href="#kulak" x="27" y="-30"/>
<use href="#kol" x="-31" y="6"/><use href="#kol" x="31" y="6"/>
<use href="#govde"/><use href="#karin" y="22"/><use href="#allik" x="-24" y="2" opacity=".5"/><use href="#allik" x="24" y="2" opacity=".5"/>
<g transform="translate(-14 -8)"><use href="#gozKure"/><use href="#iris"/><use href="#parilti"/></g>
<g transform="translate(14 -8)"><use href="#gozKure"/><use href="#iris"/><use href="#parilti"/></g>
<path d="M-4 6 q4 3.4 8 0" fill="none" stroke="#3b2433" stroke-width="1.9" stroke-linecap="round"/>
</g></svg>
